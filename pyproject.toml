[project]
name = "policy-weather-agent"
version = "0.2.0"
description = "Extended ADK agent demo: policy lookup from GCS + weather from OpenWeatherMap, showcasing Agent Registry, Auth Manager, and Semantic Governance."
requires-python = ">=3.10"
dependencies = [
  "google-cloud-aiplatform[adk,agent_engines]>=1.95.0",
  "google-adk>=1.0.0",
  "google-cloud-storage>=2.18.0",
  "google-cloud-secret-manager>=2.20.0",
  "google-auth>=2.35.0",
  "pydantic>=2.7.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["policy_agent"]
